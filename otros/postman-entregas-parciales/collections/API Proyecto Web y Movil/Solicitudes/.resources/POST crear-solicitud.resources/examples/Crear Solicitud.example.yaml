  url: "{{baseUrl}}/solicitudes"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "titulo": "Bache en calle principal",
        "categoria": "Infraestructura",
        "descripcion": "Existe un bache de gran tamaño en la calle principal que representa un peligro para los vehículos.",
        "direccion": "Av. Principal 123",
        "comuna": "Santiago",
        "prioridad": "alta"
      }
