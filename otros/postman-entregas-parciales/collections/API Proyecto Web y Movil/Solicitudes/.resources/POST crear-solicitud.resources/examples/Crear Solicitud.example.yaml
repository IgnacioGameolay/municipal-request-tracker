$kind: http-example
description: |-
  Crea una nueva solicitud ciudadana en el sistema.

  **Requiere autenticación:** Bearer Token `{{token}}` (rol: ciudadano)

  **Estados disponibles:** `pendiente`, `en_revision`, `resuelta`, `rechazada`

  **Prioridades disponibles:** `baja`, `media`, `alta`
