$kind: http-example
description: |-
  Registra un nuevo usuario en el sistema.

  **No requiere autenticación previa.**

  Crea una cuenta con rol `ciudadano` o `funcionario`. Los campos `rut`, `region`
  y `comuna` son obligatorios según el modelo de datos.

  **Roles disponibles:** `ciudadano`, `funcionario`
request:
  url: "{{baseUrl}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "nombre": "Vicente",
        "apellido": "Quezada",
        "rut": "12345678-9",
        "region": "Valparaíso",
        "comuna": "Viña del Mar",
        "email": "ciudadano2.prueba@correo.com",
        "password": "PasswordSeguro123!"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    x-powered-by: Express
    access-control-allow-origin: http://localhost:8100
    vary: Origin
