$kind: http-request
name: Iniciar Sesión
method: POST
url: "{{baseUrl}}/auth/login"
auth:
  type: bearer
  credentials:
    token: ""
examples: .resources/POST login.resources/examples
order: 1000
description: |-
  Autentica a un usuario (ciudadano o funcionario) y retorna un token JWT.

  **No requiere autenticación previa.**

  Guarda el token recibido en la variable de entorno `{{token}}` para usarlo
  en los demás endpoints protegidos.

  **Roles disponibles:** `ciudadano`, `funcionario`
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "vicequezagallardo@gmail.com",
      "password": "panchita450"
    }
