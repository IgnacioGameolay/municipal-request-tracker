$kind: http-request
name: Registrar Usuario
method: POST
url: '{{baseUrl}}/auth/register'
order: 2000
description: |-
  Registra un nuevo usuario en el sistema.
  
  **No requiere autenticación previa.**
  
  Crea una cuenta con rol `ciudadano` o `funcionario`. Los campos `rut`, `region`
  y `comuna` son obligatorios según el modelo de datos.
  
  **Roles disponibles:** `ciudadano`, `funcionario`
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "rut": "12345678-9",
      "email": "juan.perez@ejemplo.com",
      "password": "contraseña123",
      "region": "Región Metropolitana",
      "comuna": "Santiago",
      "rol": "ciudadano"
    }
