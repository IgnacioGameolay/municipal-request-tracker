$kind: http-request
name: Iniciar Sesión (Ciudadano)
method: POST
url: "{{baseUrl}}/auth/login"
examples: .resources/POST login-ciudadano.resources/examples
order: 1500
description: |-
  Autentica a un **ciudadano** y guarda el token en `{{tokenCiudadano}}`.

  **No requiere autenticación previa.**

  El script de Tests guarda automáticamente el token recibido en la variable de entorno `tokenCiudadano`.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "ciudadano@demo.cl",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      if (jsonData.token) {
        pm.environment.set("tokenCiudadano", jsonData.token);
        console.log("tokenCiudadano guardado:", jsonData.token);
      }
    language: text/javascript
