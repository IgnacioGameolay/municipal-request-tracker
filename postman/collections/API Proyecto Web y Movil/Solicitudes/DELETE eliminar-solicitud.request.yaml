$kind: http-request
name: Eliminar Solicitud
method: DELETE
url: "{{baseUrl}}/solicitudes/7d3cbf52-9b1b-4c52-9810-f14421a87f2c"
examples: .resources/DELETE eliminar-solicitud.resources/examples
order: 6000
description: |-
  Elimina permanentemente una solicitud del sistema.

  **Requiere autenticación:** Bearer Token `{{token}}`

  Reemplaza `{{solicitudId}}` con el UUID de la solicitud a eliminar.

  ⚠️ **Esta acción es irreversible.** Al eliminar una solicitud, también se
  eliminan en cascada sus documentos, notificaciones, historial y mensajes asociados.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
