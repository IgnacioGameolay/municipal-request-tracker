$kind: http-example
description: |-
  Crea una nueva solicitud ciudadana en el sistema.

  **Requiere autenticación:** Bearer Token `{{token}}` (rol: ciudadano)

  **Estados disponibles:** `pendiente`, `en_revision`, `resuelta`, `rechazada`

  **Prioridades disponibles:** `baja`, `media`, `alta`
request:
  url: "{{baseUrl}}/solicitudes"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "titulo": "Bache en calle principal",
        "categoria": "Infraestructura",
        "descripcion": "Existe un bache de gran tamaño en la calle principal que representa un peligro para los vehículos.",
        "direccion": "Av. Principal 123",
        "comuna": "Santiago",
        "prioridad": "alta"
      }
