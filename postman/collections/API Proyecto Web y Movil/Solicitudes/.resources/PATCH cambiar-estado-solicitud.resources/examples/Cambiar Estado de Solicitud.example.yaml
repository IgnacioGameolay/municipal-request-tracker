$kind: http-example
description: |-
  Actualiza únicamente el estado de una solicitud (acción parcial).

  **Requiere autenticación:** Bearer Token `{{token}}` (rol: funcionario)

  Reemplaza `{{solicitudId}}` con el UUID de la solicitud.

  **Estados disponibles:**
  - `pendiente` — Solicitud recibida, sin revisar
  - `en_revision` — Funcionario está revisando la solicitud
  - `resuelta` — Solicitud atendida y resuelta
  - `rechazada` — Solicitud rechazada con comentario
request:
  url: "{{baseUrl}}/solicitudes/667406b4-219f-4819-9732-d00f93923a62/estado"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "estado": "en_revision",
        "comentarioFuncionario": "Se ha iniciado la revisión del caso reportado."
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    x-powered-by: Express
    access-control-allow-origin: http://localhost:8100
    vary: Origin
    content-type: application/json; charset=utf-8
    content-length: "552"
    etag: W/"228-2luv0yTu5qlGP75lrodi+hn5yjg"
    date: Mon, 01 Jun 2026 03:58:26 GMT
    connection: keep-alive
    keep-alive: timeout=5
  body:
    type: json
    content: |-
      {
        "ok": true,
        "message": "Estado de solicitud actualizado correctamente",
        "data": {
          "id": "667406b4-219f-4819-9732-d00f93923a62",
