$kind: http-example
description: |-
  **Prueba Negativa - Error 403 Forbidden**

  Intenta eliminar una solicitud usando el token de un ciudadano diferente al dueño de la solicitud.

  Para esta prueba: usa el `{{tokenCiudadano}}` de un usuario que NO sea el dueño de `{{solicitudId}}`.

  Se espera respuesta: `403 Forbidden`
request:
  url: "{{baseUrl}}/solicitudes/{{solicitudId}}"
  method: DELETE
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    x-powered-by: Express
    access-control-allow-origin: http://localhost:8100
    vary: Origin
    content-type: application/json; charset=utf-8
    content-length: "104"
    etag: W/"68-FM+99LyZM1QCuTPe/lGBOP2Hq48"
    date: Thu, 04 Jun 2026 03:42:18 GMT
    connection: keep-alive
    keep-alive: timeout=5
  body:
    type: json
    content: |-
      {
        "ok": false,
        "message": "No tienes permisos para eliminar esta solicitud",
        "errors": [
          {
            "code": "forbidden"
          }
        ]
      }
order: 1780544541802
