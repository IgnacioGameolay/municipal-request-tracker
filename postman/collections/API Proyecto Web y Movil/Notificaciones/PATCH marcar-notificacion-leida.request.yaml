$kind: http-request
name: Marcar Notificación como Leída
method: PATCH
url: "{{baseUrl}}/notificaciones/504f1c64-35ea-487c-b270-049f1a95c31b/leida"
examples: .resources/PATCH marcar-notificacion-leida.resources/examples
order: 2000
description: |-
  Marca una notificación específica como leída.

  **Requiere autenticación:** Bearer Token `{{token}}`

  Reemplaza `{{notificacionId}}` con el UUID de la notificación a marcar.

  Cambia el campo `leida` de `false` a `true` en la base de datos.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
